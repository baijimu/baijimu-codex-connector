[package]
name = "baijimu-connector-codex"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Baijimu Local connector for Codex app-server."

[[bin]]
name = "baijimu-connector-codex"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
